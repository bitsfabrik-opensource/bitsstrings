kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Android
android.nonTransitiveRClass=false
android.useAndroidX=true

#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

#Extension Module Warning
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning

#Maven Central publishing (com.vanniktech.maven.publish)
#Shared POM metadata, module name/description are set in each build.gradle.kts.
#Credentials and signing key belong in ~/.gradle/gradle.properties, never here.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/bitsfabrik-opensource/bitsstrings
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/bitsfabrik-opensource/bitsstrings
POM_SCM_CONNECTION=scm:git:https://github.com/bitsfabrik-opensource/bitsstrings.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/bitsfabrik-opensource/bitsstrings.git
POM_DEVELOPER_ID=bitsfabrik
POM_DEVELOPER_NAME=bitsfabrik
POM_DEVELOPER_URL=https://bitsfabrik.com/